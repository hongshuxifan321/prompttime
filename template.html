<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作回顾 — Agenttime</title>
<style>
  :root {
    --bg: #faf9f7; --text: #2c2c2c; --accent: #b8a080; --inset: #f3f0eb;
    --border: #e8e4df; --muted: #999; --faint: #bbb;
  }
  [data-theme="dark"] {
    --bg: #1a1a18; --text: #d0ccc4; --accent: #9a8a6a; --inset: #242320;
    --border: #33312e; --muted: #888; --faint: #666;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
    background:var(--bg);color:var(--text);line-height:1.9;
    max-width:680px;margin:0 auto;padding:80px 24px 180px;
    transition:background .4s,color .4s;font-size:1.02rem;
  }
  .theme-btn{
    position:fixed;top:20px;right:24px;width:36px;height:36px;
    border-radius:50%;border:1px solid var(--border);background:var(--bg);
    cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;
    z-index:100;transition:all .3s;color:var(--muted);
  }
  .theme-btn:hover{border-color:var(--accent);color:var(--text)}
  h1{font-size:2rem;font-weight:300;letter-spacing:.04em;margin-bottom:8px}
  .dateline{color:var(--muted);font-size:.9rem;margin-bottom:56px}
  p{margin-bottom:22px;text-align:justify}
  .n{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .w{font-weight:500;color:var(--accent)}
  .appendix{margin-top:72px;padding-top:40px;border-top:1px solid var(--border)}
  .appendix-title{color:var(--muted);font-size:.82rem;margin-bottom:16px}
  .word-cloud{display:flex;flex-wrap:wrap;gap:2px 8px;line-height:1.6}
  .wd{color:var(--muted)}
  .wd:nth-child(-n+8){font-size:1.2em;color:var(--text)}
  .wd:nth-child(n+9):nth-child(-n+20){font-size:1.02em;color:var(--muted)}
  .wd:nth-child(n+21){font-size:.82em;color:var(--faint)}
  .footer{margin-top:80px;padding-top:32px;border-top:1px solid var(--border);color:var(--faint);font-size:.82rem}
  .footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()" title="切换日/夜" id="tb">◑</button>
<h1>工作回顾</h1>

<!-- CONTENT -->
<!--
  在此替换为你的文章 HTML（替换 `<!-- CONTENT -->` 占位符本身）。
  可选：以 <p class="dateline">起止日期 &middot; 跨越 N 天 &middot; 数据来源</p> 开头作为落款行。
  文章体：每个段落用 <p>...</p> 包裹；数据数字用 <span class="n">数字</span>；高频词用 <span class="w">词</span>。
  不要改动占位符以外的模板内容。
-->

<div class="footer">
  <p>Generated by <a href="https://github.com">Agenttime</a> &middot; 数据不离开你的电脑</p>
</div>
<script>
function toggleTheme(){
  const h=document.documentElement,c=h.getAttribute('data-theme'),n="dark"===c?"light":"dark";
  h.setAttribute('data-theme',n);localStorage.setItem('pt-theme',n);
  document.getElementById('tb').textContent="dark"===n?"◐":"◑"
}
!function(){const t=localStorage.getItem('pt-theme');t&&(document.documentElement.setAttribute('data-theme',t),document.getElementById('tb').textContent="dark"===t?"◐":"◑")}();
</script>
</body>
</html>
